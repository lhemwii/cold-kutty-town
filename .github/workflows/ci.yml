# À chaque push et pull request : build (avec la vérification des types), tests des règles, essai de fumée dans Chromium.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-et-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
